<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Conditions</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #2b6cb0, #4299e1);
    transition: background 1.2s ease;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  .card {
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 22px;
    padding: 26px 22px;
    width: 90%;
    max-width: 320px;
    text-align: center;
    box-shadow: 0 10px 34px rgba(0,0,0,0.28);
  }

  .title {
    color: rgba(255,255,255,0.85);
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .big-temp {
    font-size: 56px;
    font-weight: 700;
    color: white;
    line-height: 1;
    margin-bottom: 4px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.2);
  }

  .status-text {
    color: rgba(255,255,255,0.9);
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 18px;
  }

  .readings {
    display: flex;
    justify-content: center;
    gap: 14px;
  }

  .reading {
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 14px;
    padding: 12px 16px;
    flex: 1;
  }

  .reading .value {
    font-size: 22px;
    font-weight: 700;
    color: white;
  }

  .reading .label {
    font-size: 10px;
    color: rgba(255,255,255,0.7);
    margin-top: 3px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .updated {
    margin-top: 14px;
    font-size: 10px;
    color: rgba(255,255,255,0.55);
  }

  .button-row {
    display: flex;
    gap: 8px;
    margin-top: 18px;
    justify-content: center;
  }

  .range-btn {
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    padding: 8px 14px;
    color: rgba(255,255,255,0.8);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .range-btn:hover {
    background: rgba(255,255,255,0.2);
  }

  .range-btn.active {
    background: rgba(255,255,255,0.35);
    color: white;
  }

  .chart-wrap {
    margin-top: 16px;
    background: rgba(0,0,0,0.15);
    border-radius: 14px;
    padding: 10px;
  }

  .stats-row {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
    font-size: 11px;
    color: rgba(255,255,255,0.75);
  }

  .stats-row .stat-value {
    font-weight: 700;
    color: white;
  }
</style>
</head>
<body>

<div class="card" style="max-width: 460px;">
  <div class="title">My Room</div>
  <div class="big-temp" id="bigTemp">--°</div>
  <div class="status-text" id="statusText">Loading...</div>

  <div class="readings">
    <div class="reading">
      <div class="value" id="tempValue">--°C</div>
      <div class="label">Temp</div>
    </div>
    <div class="reading">
      <div class="value" id="humidityValue">--%</div>
      <div class="label">Humidity</div>
    </div>
  </div>

  <div class="updated" id="updatedText"></div>

  <div class="button-row">
    <div class="range-btn active" data-range="day">Day</div>
    <div class="range-btn" data-range="week">Week</div>
    <div class="range-btn" data-range="month">Month</div>
    <div class="range-btn" data-range="year">Year</div>
  </div>

  <div class="chart-wrap">
    <canvas id="tempChart" height="160"></canvas>
  </div>

  <div class="stats-row">
    <div>Today's avg: <span class="stat-value" id="avgValue">--°</span></div>
    <div id="compareValue">--</div>
  </div>

  <div class="readings" style="margin-top: 12px;">
    <div class="reading">
      <div class="value" id="sunriseValue">--:--</div>
      <div class="label">Sunrise</div>
    </div>
    <div class="reading">
      <div class="value" id="sunsetValue">--:--</div>
      <div class="label">Sunset</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCPpSny6LxmkfF7wlz5J9OFjnsdcL6ZTzI",
    authDomain: "temp-sensor-ff5c3.firebaseapp.com",
    databaseURL: "https://temp-sensor-ff5c3-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "temp-sensor-ff5c3",
    storageBucket: "temp-sensor-ff5c3.firebasestorage.app",
    messagingSenderId: "737912734726",
    appId: "1:737912734726:web:3d9cde8961dcd49061ef87"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const bigTemp = document.getElementById('bigTemp');
  const statusText = document.getElementById('statusText');
  const tempValue = document.getElementById('tempValue');
  const humidityValue = document.getElementById('humidityValue');
  const updatedText = document.getElementById('updatedText');

  function formatTime() {
    const now = new Date();
    return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  // Color stops: [temperature, gradient start, gradient end, status label]
  const colorStops = [
    { temp: 10, from: '#2b6cb0', to: '#4299e1', label: 'Cold' },
    { temp: 18, from: '#2c7a7b', to: '#38b2ac', label: 'Cool' },
    { temp: 23, from: '#2f855a', to: '#48bb78', label: 'Comfortable' },
    { temp: 28, from: '#c05621', to: '#ed8936', label: 'Warm' },
    { temp: 35, from: '#c53030', to: '#f56565', label: 'Hot' }
  ];

  function getColorForTemp(temp) {
    if (temp <= colorStops[0].temp) return colorStops[0];
    for (let i = 1; i < colorStops.length; i++) {
      if (temp <= colorStops[i].temp) return colorStops[i];
    }
    return colorStops[colorStops.length - 1];
  }

  function updateDisplay(temp) {
    const stop = getColorForTemp(temp);
    document.body.style.background = `linear-gradient(135deg, ${stop.from}, ${stop.to})`;
    bigTemp.textContent = temp.toFixed(1) + '°';
    statusText.textContent = stop.label;
  }

  db.ref('/temperature').on('value', (snapshot) => {
    const val = snapshot.val();
    if (val !== null) {
      tempValue.textContent = val.toFixed(1) + '°C';
      updateDisplay(val);
      updatedText.textContent = 'Updated ' + formatTime();
    }
  });

  db.ref('/humidity').on('value', (snapshot) => {
    const val = snapshot.val();
    if (val !== null) {
      humidityValue.textContent = val.toFixed(0) + '%';
    }
  });

  // ------------------------------
  // History graph
  // ------------------------------
  let allHistory = []; // {timestamp (seconds), temperature, humidity}
  let currentRange = 'day';
  let chart = null;

  const avgValue = document.getElementById('avgValue');
  const compareValue = document.getElementById('compareValue');
  const rangeButtons = document.querySelectorAll('.range-btn');

  rangeButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      rangeButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentRange = btn.dataset.range;
      renderChart();
    });
  });

  function rangeToSeconds(range) {
    const day = 86400;
    if (range === 'day') return day;
    if (range === 'week') return day * 7;
    if (range === 'month') return day * 30;
    if (range === 'year') return day * 365;
    return day;
  }

  function renderChart() {
    const nowSec = Math.floor(Date.now() / 1000);
    const windowSec = rangeToSeconds(currentRange);
    const filtered = allHistory.filter(entry => entry.timestamp >= nowSec - windowSec);

    const labels = filtered.map(entry => {
      const d = new Date(entry.timestamp * 1000);
      if (currentRange === 'day') {
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      } else {
        return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
      }
    });
    const temps = filtered.map(entry => entry.temperature);

    if (chart) {
      chart.data.labels = labels;
      chart.data.datasets[0].data = temps;
      chart.update();
    } else {
      const ctx = document.getElementById('tempChart').getContext('2d');
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Temperature (°C)',
            data: temps,
            borderColor: 'rgba(255,255,255,0.9)',
            backgroundColor: 'rgba(255,255,255,0.15)',
            fill: true,
            tension: 0.3,
            pointRadius: 0,
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: 'rgba(255,255,255,0.6)', maxTicksLimit: 6 }, grid: { color: 'rgba(255,255,255,0.08)' } },
            y: { ticks: { color: 'rgba(255,255,255,0.6)' }, grid: { color: 'rgba(255,255,255,0.08)' } }
          }
        }
      });
    }

    updateStats(filtered);
  }

  function updateStats(filtered) {
    // Today's average
    const nowSec = Math.floor(Date.now() / 1000);
    const todayEntries = allHistory.filter(entry => entry.timestamp >= nowSec - 86400);
    if (todayEntries.length > 0) {
      const avg = todayEntries.reduce((sum, e) => sum + e.temperature, 0) / todayEntries.length;
      avgValue.textContent = avg.toFixed(1) + '°';
    }

    // "This time last week" comparison
    const targetTime = nowSec - (86400 * 7);
    let closest = null;
    let closestDiff = Infinity;
    allHistory.forEach(entry => {
      const diff = Math.abs(entry.timestamp - targetTime);
      if (diff < closestDiff) {
        closestDiff = diff;
        closest = entry;
      }
    });

    if (closest && closestDiff < 3600) { // only compare if we have a reading within 1 hour of that time
      const currentTemp = allHistory.length > 0 ? allHistory[allHistory.length - 1].temperature : null;
      if (currentTemp !== null) {
        const diffTemp = currentTemp - closest.temperature;
        const direction = diffTemp > 0 ? 'hotter' : 'colder';
        compareValue.textContent = `Last week: ${Math.abs(diffTemp).toFixed(1)}° ${direction}`;
      }
    } else {
      compareValue.textContent = 'No data for last week yet';
    }
  }

  function loadHistory() {
    db.ref('/history').once('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      allHistory = Object.keys(data).map(key => ({
        timestamp: parseInt(key),
        temperature: data[key].temperature,
        humidity: data[key].humidity
      })).sort((a, b) => a.timestamp - b.timestamp);

      renderChart();
    });
  }

  // Load history once on page load, and refresh every 5 minutes
  loadHistory();
  setInterval(loadHistory, 5 * 60 * 1000);

  // ------------------------------
  // Sunrise / Sunset
  // ------------------------------
  function loadSunTimes() {
    const lat = -27.56102;
    const lng = 151.953354;
    const url = `https://api.sunrise-sunset.org/json?lat=${lat}&lng=${lng}&formatted=0`;

    fetch(url)
      .then(response => response.json())
      .then(data => {
        const sunrise = new Date(data.results.sunrise);
        const sunset = new Date(data.results.sunset);

        document.getElementById('sunriseValue').textContent =
          sunrise.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        document.getElementById('sunsetValue').textContent =
          sunset.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      })
      .catch(err => {
        console.error('Failed to load sun times:', err);
      });
  }

  loadSunTimes();
  // Sun times barely change minute to minute, refresh once an hour
  setInterval(loadSunTimes, 60 * 60 * 1000);
</script>

</body>
</html>
